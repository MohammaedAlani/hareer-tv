plugins { id 'com.android.application' }
android {
    namespace 'family.blossom.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'family.blossom.tv'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        def endpoint = providers.gradleProperty('catalogUrl').getOrElse('')
        buildConfigField 'String', 'CATALOG_URL', groovy.json.JsonOutput.toJson(endpoint)
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
