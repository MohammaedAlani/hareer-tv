plugins { id 'com.android.application' }
android {
    namespace 'family.blossom.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'family.blossom.tv'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.0'
        def endpoint = providers.gradleProperty('catalogUrl').getOrElse('')
        buildConfigField 'String', 'UPDATE_URL', groovy.json.JsonOutput.toJson(providers.gradleProperty('updateUrl').getOrElse('https://tv.nawaa.app/downloads/update.json'))
        buildConfigField 'String', 'CATALOG_URL', groovy.json.JsonOutput.toJson(endpoint)
    }
    def releaseStore = System.getenv('HAREER_STORE_FILE')
    if (releaseStore) {
        signingConfigs {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('HAREER_STORE_PASSWORD')
                keyAlias System.getenv('HAREER_KEY_ALIAS')
                keyPassword System.getenv('HAREER_KEY_PASSWORD')
            }
        }
        buildTypes { release { signingConfig signingConfigs.release } }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
