apiVersion: v1
kind: Namespace
metadata:
  name: hareer-tv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalog
  namespace: hareer-tv
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hareer-tv
  namespace: hareer-tv
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hareer-tv
  template:
    metadata:
      labels:
        app: hareer-tv
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          # Replace with an image built from the verified main commit.
          image: your-registry.example/hareer-tv:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hareer-admin
                  key: token
            - name: PUBLIC_BASE_URL
              value: https://tv.nawaa.app
          envFrom:
            - secretRef:
                name: hareer-storage
                optional: true
          volumeMounts:
            - name: catalog
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
      volumes:
        - name: catalog
          persistentVolumeClaim:
            claimName: catalog
---
apiVersion: v1
kind: Service
metadata:
  name: hareer-tv
  namespace: hareer-tv
spec:
  selector:
    app: hareer-tv
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hareer-tv
  namespace: hareer-tv
spec:
  # Match this to your cluster's ingress controller.
  ingressClassName: nginx
  tls:
    - hosts: [tv.nawaa.app]
      secretName: hareer-tv-tls
  rules:
    - host: tv.nawaa.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hareer-tv
                port:
                  number: 80
